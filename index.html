
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Thesis</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div id="gameContainer">
  <div id="hud">
    <span>⭐ <span id="score">0</span></span>
    <span>📚 CFU <span id="cfu">0</span>/180</span>
    <span>❤️ <span id="lives">3</span></span>
  </div>
  <div id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div id="message">
      <h2>👾 ESAMI INVADERS</h2>
      <p style="color:#7fff7f;font-size:14px;margin-top:4px">Trascina per muoverti<br>Sparo automatico!</p>
      <br>
      <button class="sbtn" onclick="startGame()">▶ INIZIA</button>
    </div>
  </div>
</div>
  <script src="script.js"></script>
</body>
</html>
